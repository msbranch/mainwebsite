<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Financial Floor Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f7f6f4; --ink: #121116; --powder: #b8d4e8; --lav: #c9b8e8; --violet: #7d6ba6;
  --muted: #69636f; --body: #3a3a42; --line: #e4dfd8; --card: #ffffff;
  --red: #b04a4a; --green: #4a7a5a; --amber: #9a7b33;
  --serif: "Playfair Display", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; }
#app { background: var(--paper); color: var(--body); font-family: var(--sans); min-height: 100vh; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 24px 80px; }

.notice { background: #efeaf6; color: var(--violet); border-bottom: 1px solid #ddd3ec; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-align: center; padding: 9px 16px; }
.notice b { color: #5c4d84; }

.topbar { border-bottom: 1px solid var(--line); background: rgba(247,246,244,0.92); }
.topbar__in { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand__k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); display: block; }
.brand__w { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--ink); }
.brand__w em { color: var(--violet); }
.acct { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
.acct a { color: var(--body); text-decoration: none; border-bottom: 1px solid transparent; cursor: pointer; }
.acct a:hover { border-bottom-color: var(--violet); }

.btn { font-family: var(--sans); font-size: 14px; font-weight: 600; border-radius: 6px; padding: 11px 18px; cursor: pointer; border: 1px solid transparent; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn--dark { background: var(--ink); color: #fff; }
.btn--ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn--violet { background: var(--violet); color: #fff; }
.btn--danger { background: #fff; color: var(--red); border-color: #e3c3c3; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1.title { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.1; color: var(--ink); margin: 0 0 8px; }
h1.title em { color: var(--violet); }
.lede { font-size: 16px; line-height: 1.6; color: var(--body); margin: 0 0 8px; max-width: 62ch; }
.hint { font-size: 13px; color: var(--muted); }

/* sign-in */
.signin { max-width: 460px; margin: 12vh auto 0; text-align: center; }
.signin .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 34px 30px; }
.signin .brand__w { font-size: 26px; }
.signin .lede { text-align: left; margin: 16px 0 22px; }

/* workspace */
.section-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 30px 0 6px; }
.ws-actions { display: flex; gap: 10px; }
.empty { background: #fbfaf8; border: 1px dashed #cdc6bd; border-radius: 12px; padding: 40px 28px; text-align: center; margin-top: 18px; }
.empty h3 { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0 auto 20px; max-width: 44ch; }
.empty .ws-actions { justify-content: center; }

.months { display: grid; gap: 12px; margin-top: 18px; }
.month { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.month__main { display: flex; align-items: center; gap: 16px; }
.month__label { font-family: var(--serif); font-size: 18px; color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st-green { color: var(--green); } .st-green .dot { background: var(--green); }
.st-black { color: var(--ink); } .st-black .dot { background: var(--lav); }
.st-red { color: var(--red); } .st-red .dot { background: var(--red); }
.st-review { color: var(--amber); } .st-review .dot { background: var(--amber); }
.month__figs { font-size: 13px; color: var(--muted); }
.month__figs b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.month__actions { display: flex; gap: 8px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--violet); cursor: pointer; font-size: 13px; font-weight: 600; }
.del { color: var(--muted); }

/* privacy */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; margin-top: 18px; }
.card h2 { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0 0 10px; }
.card ul { margin: 10px 0 0; padding-left: 18px; }
.card li { margin: 5px 0; font-size: 14px; }
.danger-zone { border-color: #e3c3c3; background: #fdf7f7; }

.crumbs { font-size: 13px; color: var(--muted); margin: 20px 0 0; }
.crumbs a { color: var(--violet); cursor: pointer; text-decoration: none; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; }

@media (max-width: 640px) {
  .month { flex-direction: column; align-items: flex-start; }
  .section-top { flex-direction: column; align-items: flex-start; }
}

/* ── in-month step screens ── */
.mstep { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 4px; }
.mstep-chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.mstep-chip.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }
.mstep-chip.is-done { color: var(--violet); border-color: #ddd3ec; }
.row-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.spacer { flex: 1; }
.fld { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 5px; }
input.in, select.in { font-family: var(--sans); font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
input.in { width: 160px; }
.income-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.income-row .lbl { flex: 1; max-width: 240px; }
.income-total { font-family: var(--serif); font-size: 22px; color: var(--ink); margin-top: 14px; }
.dropzone { border: 1.5px dashed #cdc6bd; border-radius: 10px; padding: 34px; text-align: center; color: var(--muted); background: #fbfaf8; margin-top: 8px; }
.dropzone .lock { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.class-key { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; background: #fbfaf8; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 14px; }
.class-key .ck { font-size: 13px; color: var(--body); line-height: 1.45; }
.k-tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; color: var(--ink); background: #efeaf6; border: 1px solid #ddd3ec; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
.tbl th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid #f0ece5; vertical-align: middle; }
.tbl input.amt { width: 88px; }
.tbl select.in { font-size: 13px; padding: 6px 8px; }
.tbl .desc { color: var(--ink); }
.tbl tr.dep td { background: #f7f4fb; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet); border: 1px solid #ddd3ec; border-radius: 4px; padding: 1px 6px; }
.snap { background: var(--ink); color: #e7e6f2; border-radius: 12px; padding: 28px; margin-top: 4px; }
.snap .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9a94a6; }
.snap .status { display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 6px 0 18px; }
.snap .status.st-green { color: #7fd0a0; } .snap .status.st-green .dot { background: #7fd0a0; }
.snap .status.st-black { color: var(--lav); } .snap .status.st-black .dot { background: var(--lav); }
.snap .status.st-red { color: #e59a9a; } .snap .status.st-red .dot { background: #e59a9a; }
.snap .status.st-review { color: #e6c877; } .snap .status.st-review .dot { background: #e6c877; }
.snap .big { font-family: var(--serif); font-size: 46px; font-weight: 600; color: #fff; line-height: 1; }
.snap .figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 20px; margin-top: 22px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 20px; }
.snap .fig .n { font-family: var(--serif); font-size: 22px; color: #fff; }
.snap .fig.lav .n { color: var(--lav); }
.snap .cats { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 16px; }
.snap .cats .crow { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #cfcbd8; }
.snap .cats .crow b { font-family: var(--mono); font-weight: 500; color: #fff; }
.read { display: grid; gap: 16px; margin-top: 4px; }
.read .item { border-left: 3px solid var(--lav); padding: 2px 0 2px 16px; }
.read .item .q { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.read .item .a { font-size: 15px; color: var(--ink); line-height: 1.5; }
.gate { background: #fbfaf8; border: 1px dashed #cdc6bd; border-radius: 10px; padding: 22px; color: var(--muted); }
.routes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.route { border: 1px solid var(--line); border-radius: 10px; padding: 20px; background: #fff; cursor: pointer; text-align: left; }
.route.is-sel { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset; }
.route h3 { font-family: var(--serif); font-size: 19px; color: var(--ink); margin: 0 0 6px; }
.route p { font-size: 13px; color: var(--body); margin: 0; line-height: 1.5; }
.cmp { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14px; }
.cmp th, .cmp td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.cmp .up { color: var(--red); } .cmp .down { color: var(--green); }
.changed { background: #f4f1fb; border: 1px solid #ddd3ec; border-radius: 10px; padding: 18px; margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--ink); }
@media (max-width: 720px) { .class-key, .snap .figs, .routes { grid-template-columns: 1fr; } }

/* wide-table scroll container (page body never scrolls sideways) */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 14px; }
.table-scroll .tbl { margin-top: 0; min-width: 640px; }
.table-scroll .cmp { margin-top: 0; min-width: 520px; }
/* grouped snapshot breakdown (Fixed / Variable, each with categories + subtotal) */
.snap .cat-group { margin-bottom: 16px; }
.snap .cat-group:last-child { margin-bottom: 0; }
.snap .cat-head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lav); padding-bottom: 7px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.14); }
.snap .cat-head b { color: #fff; font-size: 13px; }

/* ── intake / starting point / responsibility map ── */
select.in.wide { min-width: 320px; max-width: 100%; }
textarea.in.ta { width: 100%; max-width: 560px; resize: vertical; font-family: var(--sans); line-height: 1.5; }
.intake .fld { margin-top: 18px; }
.startpoint { display: grid; gap: 14px; margin: 6px 0 4px; }
.sp-item { border-left: 3px solid var(--lav); padding: 2px 0 2px 16px; }
.sp-item .q { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sp-item .a { font-size: 16px; color: var(--ink); line-height: 1.5; }
.mapgroups { display: grid; gap: 14px; margin-top: 6px; }
.mapgroup { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.mapgroup__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.mapgroup__head h3 { font-family: var(--serif); font-size: 18px; color: var(--ink); margin: 0; }
.mapitem { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.mapitem .in.grow { flex: 1; min-width: 180px; }
.cadence-sel { margin-top: 6px; display: block; font-size: 12.5px; }

/* workspace map summary card */
.mapcard { padding: 18px 22px; }
.mapcard__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.mapcard__links { font-size: 13px; color: var(--muted); }
.rg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.rg-chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; color: var(--ink); background: #efeaf6; border: 1px solid #ddd3ec; border-radius: 999px; padding: 5px 11px; }
.rg-chip.is-empty { color: var(--muted); background: #fbfaf8; border-color: var(--line); }

/* welcome */
.welcome .row-actions { margin-top: 24px; }

/* route relevance */
.route { position: relative; }
.route.is-relevant { border-color: var(--violet); }
.route__tag { position: absolute; top: 10px; right: 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet); background: #efeaf6; border: 1px solid #ddd3ec; border-radius: 999px; padding: 2px 8px; }

/* workspace contextual line (one sentence from intake; no six-role cards) */
.ws-context { font-size: 14px; color: var(--muted); margin: 26px 0 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

/* lighter intake controls */
.opt-tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; margin-left: 6px; }
input.in.wide { width: 100%; max-width: 520px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 2px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--body); }
.check input { accent-color: var(--violet); width: auto; }

</style>
</head>

<div id="app"></div>
